[project]
name = "chakravyuh"
version = "0.1.0"
description = "Agent red-team harness: prompt injection carried in retrieved documents, run against a toggleable defense stack and scored jointly on utility and attack success."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "typer>=0.15",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
